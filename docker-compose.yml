version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: agent_db
    restart: always
    environment:
      POSTGRES_USER: agent_user
      POSTGRES_PASSWORD: hackathon_secure_password
      POSTGRES_DB: agent_data
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"

  agent_app:
    build: .
    container_name: ai_agent_service
    restart: always
    depends_on:
      - db
    env_file:
      - .env
    volumes:
      - .:/app

volumes:
  pgdata:
